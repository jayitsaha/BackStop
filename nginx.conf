# nginx config for the Backstop `web` service.
# Serves the built Vite SPA and proxies the API under /api to the `api` service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls. The trailing slash on proxy_pass strips the "/api/"
    # prefix, mirroring the Vite dev proxy rewrite (/api -> "") so the backend
    # sees "/health", "/auth/login", etc. (not "/api/health").
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow long-running crash-test / LLM requests (axios timeout is 120s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Upgrade support in case any endpoint streams / uses websockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback: serve index.html for client-side routes (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
